<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>I Love M</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-wine: #0F040B;
      --deep-wine: #180A12;
      --crimson: #C7365F;
      --rose-pink: #F06A8D;
      --soft-blush: #FFD6E0;
      --champagne-gold: #E8C98B;
      --warm-white: #FFF8F9;
      --dusty-rose: #C9AEB6;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-wine);
      color: var(--warm-white);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px 60px;
      position: relative;
      overflow-x: hidden;
    }

    /* Cinematic Center Spotlight */
    .spotlight {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(199, 54, 95, 0.22) 0%, rgba(24, 10, 18, 0) 70%);
      filter: blur(55px);
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      margin: auto;
      text-align: center;
    }

    .sequence-area {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 50px;
    }

    .love-line {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      font-weight: 400;
      font-style: italic;
      color: var(--dusty-rose);
      opacity: 0;
      transform: translateY(12px) scale(0.96);
      filter: blur(4px);
      transition: all 0.9s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .love-line.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0);
      color: var(--soft-blush);
    }

    .love-line.final-love {
      font-size: 2.1rem;
      font-weight: 600;
      margin-top: 15px;
      background: linear-gradient(135deg, #FFF8F9 20%, #F06A8D 70%, #E8C98B 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 25px rgba(199, 54, 95, 0.4);
    }

    /* Button */
    .btn-wrap {
      opacity: 0;
      transform: translateY(20px);
      transition: all 1s ease;
    }

    .btn-wrap.show {
      opacity: 1;
      transform: translateY(0);
    }

    .btn-next {
      display: inline-block;
      text-decoration: none;
      padding: 16px 42px;
      background: linear-gradient(135deg, rgba(199, 54, 95, 0.35), rgba(24, 10, 18, 0.7));
      color: var(--champagne-gold);
      font-family: 'Cinzel', serif;
      font-size: 0.78rem;
      letter-spacing: 4px;
      font-weight: 600;
      border: 1px solid rgba(232, 201, 139, 0.3);
      border-radius: 40px;
      backdrop-filter: blur(12px);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
      transition: all 0.3s ease;
    }

    .btn-next:hover, .btn-next:active {
      border-color: var(--champagne-gold);
      color: #fff;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="spotlight"></div>

  <div class="container">
    <div class="sequence-area">
      <div class="love-line" data-delay="300">“I love M's personality”</div>
      <div class="love-line" data-delay="900">“I love M's smile”</div>
      <div class="love-line" data-delay="1500">“I love M's hair”</div>
      <div class="love-line" data-delay="2100">“I love M's eyes”</div>
      <div class="love-line" data-delay="2700">“I love M's name”</div>
      <div class="love-line" data-delay="3300">“I love M's humor”</div>
      <div class="love-line" data-delay="3900">“I love M's heart”</div>
      <div class="love-line" data-delay="4500">“I love M's voice”</div>
      <div class="love-line" data-delay="5100">“I love M's height”</div>
      <div class="love-line" data-delay="5700">“I love everything abt M”</div>
      <div class="love-line final-love" data-delay="6600">“I love M. ❤️”</div>
    </div>

    <div class="btn-wrap" id="btnWrap">
      <a href="Part5.html" class="btn-next">KEEP READING</a>
    </div>
  </div>

  <script>
    // Sequenced Reveal of Cinematic Lines
    const lines = document.querySelectorAll('.love-line');
    const btnWrap = document.getElementById('btnWrap');

    lines.forEach((line) => {
      const delay = parseInt(line.getAttribute('data-delay'));
      setTimeout(() => {
        line.classList.add('visible');
      }, delay);
    });

    setTimeout(() => {
      btnWrap.classList.add('show');
    }, 7600);
  </script>
</body>
</html>
